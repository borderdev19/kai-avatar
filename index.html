<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f20"><title>KAI | Laboratorio iPhone</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#ecfbff;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:18px}h1{color:#53ece5}section{border:1px solid #2b5468;background:#111e31;border-radius:18px;padding:16px;margin:14px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #396679}button{background:#087f82;color:white;font-weight:700;margin:4px 4px 4px 0}input{width:100%;background:#071422;color:white}.avatar{height:230px;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle,#23546e,#101b30);position:relative;overflow:hidden}.head{width:115px;height:135px;background:#efc4b5;border-radius:45%;position:absolute;top:55px;z-index:2}.hair{position:absolute;top:26px;width:145px;height:95px;background:#11172b;border-radius:55% 50% 35% 35%;z-index:3;box-shadow:12px -8px #0a829d;pointer-events:none}.eyes{display:flex;justify-content:space-around;margin-top:46px}.eye{background:#1dd4ed;border-top:4px solid #1d253b;width:18px;height:12px;border-radius:50%}.mouth{width:23px;height:6px;background:#80394d;border-radius:50%;margin:20px auto}.talking .mouth{animation:talk .2s infinite alternate}@keyframes talk{to{height:21px}}.torso{position:absolute;bottom:-62px;width:190px;height:115px;background:#17273a;border:4px solid #16d5d3;border-radius:70px 70px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071321;padding:12px;border-radius:10px;min-height:70px;max-height:260px;overflow:auto}small,p{color:#b8cad7}.ok{color:#6ff0c8}</style></head><body><main><h1>KAI <small>iPhone · Fase 1.4</small></h1><p>Laboratorio sin conexión a Kick, sin IA de pago y sin transmisión. No introduzcas contraseñas ni claves.</p><section><div id="avatar" class="avatar"><div class="torso"></div><div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><div class="hair"></div></div><p>Estado: <strong id="status" class="ok">Cargando…</strong></p><button id="voice">Probar voz</button><button id="beep">Probar sonido</button><button id="media">Probar audio HTML</button><audio id="player" controls playsinline preload="auto" style="width:100%;margin:8px 0"></audio><button id="voices">Buscar voces</button><select id="voiceSelect" style="width:100%;padding:12px;background:#071422;color:white;border:1px solid #396679;border-radius:10px"><option value="">Voz automática</option></select><button id="mute">Silenciar voz</button><button id="test">Ejecutar pruebas</button></section><section><h3>Chat simulado</h3><input id="message" maxlength="240" placeholder="Escribe Hola KAI"><button id="send">Enviar mensaje</button><button id="sample">Simular espectador</button><pre id="log" aria-live="polite"></pre></section><section><h3>Diagnóstico</h3><pre id="results">Pendiente</pre></section></main><script>(function(){'use strict';var el=function(id){return document.getElementById(id)},enabled=true,count=0,timer,utterance=null;function state(s){el("status").textContent=s;el("results").textContent=s+"\n"+el("results").textContent.slice(0,900)}function voices(){if(!("speechSynthesis" in window))return [];return speechSynthesis.getVoices()}function loadVoices(){var v=voices(),sel=el("voiceSelect"),prev=sel.value;sel.innerHTML="<option value=\"\">Voz automática</option>";v.forEach(function(x,i){var o=document.createElement("option");o.value=String(i);o.textContent=x.name+" ("+x.lang+")";sel.appendChild(o)});if(prev)sel.value=prev;state("Voces detectadas: "+v.length+"; español: "+v.filter(function(x){return /^es/i.test(x.lang)}).length)}function answer(s){s=s.toLowerCase();if(s.indexOf('hola')>=0)return '¡Hola! Soy KAI, tu streamer virtual.';if(s.indexOf('juego')>=0)return 'Me encantan los videojuegos. ¿Qué jugamos hoy?';if(s.indexOf('kick')>=0)return 'Todavía estamos en pruebas, sin transmitir a Kick.';return 'Te escucho. Por ahora mis respuestas son simuladas.'}function add(s){el('log').textContent+=s+'\n';el('log').scrollTop=el('log').scrollHeight}function stop(){clearTimeout(timer);el('avatar').classList.remove('talking');el('status').textContent='Listo'}function say(s){if(!enabled){state('Voz silenciada');return}if(!('speechSynthesis' in window)){state('SpeechSynthesis no disponible');return}try{var synth=window.speechSynthesis;if(synth.speaking||synth.pending)synth.cancel();var u=new SpeechSynthesisUtterance(s);utterance=u;u.lang='es-MX';u.rate=1;u.pitch=1;u.volume=1;var v=voices(),selected=el('voiceSelect').value;if(selected!==''){u.voice=v[Number(selected)]||null}else{u.voice=v.find(function(x){return /^es-MX$/i.test(x.lang)})||v.find(function(x){return /^es/i.test(x.lang)})||null}if(u.voice)u.lang=u.voice.lang;u.onstart=function(){if(utterance!==u)return;state('Voz iniciada: '+(u.voice?u.voice.name:'predeterminada'));el('avatar').classList.add('talking')};u.onend=function(){if(utterance!==u)return;stop();state('Voz finalizada')};u.onerror=function(e){if(utterance!==u)return;stop();state('Error de voz: '+e.error+'; voces: '+voices().length)};state('Iniciando voz; seleccionada: '+(u.voice?u.voice.name:'automática')+'; voces disponibles: '+v.length);synth.speak(u);setTimeout(function(){if(utterance!==u)return;if(synth.paused)synth.resume();if(!synth.speaking&&!synth.pending)state('Sin voz activa; prueba otra voz. Voces: '+voices().length);else if(synth.pending&&!synth.speaking)state('Voz pendiente; Safari no inició síntesis. Voces: '+voices().length)},2200)}catch(e){state('Error de voz: '+e.message)}}function send(s){if(!s.trim())return;add('Espectador: '+s);var r=answer(s);add('KAI: '+r);say(r)}function makeWav(){var rate=22050,n=rate/2,buf=new ArrayBuffer(44+n*2),d=new DataView(buf);function str(p,x){for(var i=0;i<x.length;i++)d.setUint8(p+i,x.charCodeAt(i))}str(0,'RIFF');d.setUint32(4,36+n*2,true);str(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);str(36,'data');d.setUint32(40,n*2,true);for(var i=0;i<n;i++){var fade=Math.min(1,i/800,(n-i)/800);d.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*660*i/rate)*11000*fade),true)}return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}var audio=el('player');audio.src=makeWav();audio.addEventListener('playing',function(){state('Audio HTML reproduciéndose')});audio.addEventListener('error',function(){state('Error HTML audio: '+(audio.error?audio.error.code:'desconocido'))});el('media').addEventListener('click',function(){audio.currentTime=0;var p=audio.play();state('Solicitando audio HTML…');if(p&&p.catch)p.catch(function(e){state('Audio HTML bloqueado: '+e.name+' '+e.message)})});el('beep').addEventListener('click',function(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C){state('AudioContext no disponible');return}var ctx=new C();ctx.resume().then(function(){var osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=440;gain.gain.value=.12;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.35);state('Tono de prueba reproducido (440 Hz)')}).catch(function(e){state('Audio bloqueado: '+e.message)})}catch(e){state('Error de audio: '+e.message)}});el('voices').addEventListener('click',loadVoices);if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;el('voice').addEventListener('click',function(){say('Hola, soy KAI. Estoy funcionando desde Safari en tu iPhone.')});el('mute').addEventListener('click',function(){enabled=!enabled;el('mute').textContent=enabled?'Silenciar voz':'Activar voz';if(!enabled){if('speechSynthesis' in window)window.speechSynthesis.cancel();stop()}});el('send').addEventListener('click',function(){var s=el('message').value;el('message').value='';send(s)});el('message').addEventListener('keydown',function(e){if(e.key==='Enter')el('send').click()});el('sample').addEventListener('click',function(){var samples=['Hola KAI','¿Qué juegos te gustan?','¿Ya transmites en Kick?'];send(samples[count++%samples.length])});el('test').addEventListener('click',function(){var t=[['JavaScript ejecutándose',true],['Avatar presente',!!el('avatar')],['Respuesta hola',answer('hola').indexOf('Hola')>=0],['Respuesta juegos',answer('juegos').indexOf('videojuegos')>=0],['Entrada de chat',!!el('message')],['Síntesis de voz detectada','speechSynthesis' in window]];el('results').textContent=t.map(function(x){return(x[1]?'OK':'NO DISPONIBLE')+' — '+x[0]}).join('\n')+'\n\nLa voz debe probarse escuchándola. Kick, IA y emisión no están conectados.'});el('status').textContent='Listo';add('Sistema: JavaScript cargado. Pulsa Ejecutar pruebas.')})();</script></body></html>
