<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f20"><title>KAI | Laboratorio iPhone</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#ecfbff;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:18px}h1{color:#53ece5}section{border:1px solid #2b5468;background:#111e31;border-radius:18px;padding:16px;margin:14px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #396679}button{background:#087f82;color:white;font-weight:700;margin:4px 4px 4px 0}input{width:100%;background:#071422;color:white}.avatar{height:230px;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle,#23546e,#101b30);position:relative;overflow:hidden}.head{width:115px;height:135px;background:#efc4b5;border-radius:45%;position:absolute;top:55px;z-index:2}.hair{position:absolute;top:26px;width:145px;height:95px;background:#11172b;border-radius:55% 50% 35% 35%;z-index:3;box-shadow:12px -8px #0a829d;pointer-events:none}.eyes{display:flex;justify-content:space-around;margin-top:46px}.eye{background:#1dd4ed;border-top:4px solid #1d253b;width:18px;height:12px;border-radius:50%}.mouth{width:23px;height:6px;background:#80394d;border-radius:50%;margin:20px auto}.talking .mouth{animation:talk .2s infinite alternate}@keyframes talk{to{height:21px}}.torso{position:absolute;bottom:-62px;width:190px;height:115px;background:#17273a;border:4px solid #16d5d3;border-radius:70px 70px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071321;padding:12px;border-radius:10px;min-height:70px;max-height:260px;overflow:auto}small,p{color:#b8cad7}.ok{color:#6ff0c8}</style></head><body><main><h1>KAI <small>iPhone · Fase 1.1</small></h1><p>Laboratorio sin conexión a Kick, sin IA de pago y sin transmisión. No introduzcas contraseñas ni claves.</p><section><div id="avatar" class="avatar"><div class="torso"></div><div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><div class="hair"></div></div><p>Estado: <strong id="status" class="ok">Cargando…</strong></p><button id="voice">Probar voz</button><button id="mute">Silenciar voz</button><button id="test">Ejecutar pruebas</button></section><section><h3>Chat simulado</h3><input id="message" maxlength="240" placeholder="Escribe Hola KAI"><button id="send">Enviar mensaje</button><button id="sample">Simular espectador</button><pre id="log" aria-live="polite"></pre></section><section><h3>Diagnóstico</h3><pre id="results">Pendiente</pre></section></main><script>(function(){'use strict';var el=function(id){return document.getElementById(id)},enabled=true,count=0,timer;function answer(s){s=s.toLowerCase();if(s.indexOf('hola')>=0)return '¡Hola! Soy KAI, tu streamer virtual.';if(s.indexOf('juego')>=0)return 'Me encantan los videojuegos. ¿Qué jugamos hoy?';if(s.indexOf('kick')>=0)return 'Todavía estamos en pruebas, sin transmitir a Kick.';return 'Te escucho. Por ahora mis respuestas son simuladas.'}function add(s){el('log').textContent+=s+'\n';el('log').scrollTop=el('log').scrollHeight}function stop(){clearTimeout(timer);el('avatar').classList.remove('talking');el('status').textContent='Listo'}function say(s){stop();if(!enabled){el('status').textContent='Voz silenciada';return}el('avatar').classList.add('talking');timer=setTimeout(stop,Math.max(1200,s.length*65));if(!('speechSynthesis' in window)){el('status').textContent='Voz no disponible';return}try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='es-MX';u.rate=1;u.onstart=function(){el('status').textContent='Hablando'};u.onend=stop;u.onerror=function(){el('status').textContent='Voz no disponible';el('avatar').classList.remove('talking')};window.speechSynthesis.speak(u)}catch(e){el('status').textContent='Error de voz: '+e.message}}function send(s){if(!s.trim())return;add('Espectador: '+s);var r=answer(s);add('KAI: '+r);say(r)}el('voice').addEventListener('click',function(){say('Hola, soy KAI. Estoy funcionando desde Safari en tu iPhone.')});el('mute').addEventListener('click',function(){enabled=!enabled;el('mute').textContent=enabled?'Silenciar voz':'Activar voz';if(!enabled){if('speechSynthesis' in window)window.speechSynthesis.cancel();stop()}});el('send').addEventListener('click',function(){var s=el('message').value;el('message').value='';send(s)});el('message').addEventListener('keydown',function(e){if(e.key==='Enter')el('send').click()});el('sample').addEventListener('click',function(){var samples=['Hola KAI','¿Qué juegos te gustan?','¿Ya transmites en Kick?'];send(samples[count++%samples.length])});el('test').addEventListener('click',function(){var t=[['JavaScript ejecutándose',true],['Avatar presente',!!el('avatar')],['Respuesta hola',answer('hola').indexOf('Hola')>=0],['Respuesta juegos',answer('juegos').indexOf('videojuegos')>=0],['Entrada de chat',!!el('message')],['Síntesis de voz detectada','speechSynthesis' in window]];el('results').textContent=t.map(function(x){return(x[1]?'OK':'NO DISPONIBLE')+' — '+x[0]}).join('\n')+'\n\nLa voz debe probarse escuchándola. Kick, IA y emisión no están conectados.'});el('status').textContent='Listo';add('Sistema: JavaScript cargado. Pulsa Ejecutar pruebas.')})();</script></body></html>
